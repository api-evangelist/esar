name: Esar
description: Esar (ايسار) is a Saudi Arabia and UAE based car rental marketplace that connects vehicle
  owners with renters through a mobile app, offering luxury, sports, family, and 4x4 vehicles across
  Riyadh, Jeddah, Mecca, and Dubai. The platform lets car owners list vehicles to earn recurring returns
  while giving travelers on-demand access to a curated fleet at competitive daily rates. Headquartered in
  Jeddah, Esar is an early-stage startup backed by 500 Global and the Taqadam accelerator. This API
  Evangelist profile tracks the company as a portfolio lead; no public developer API surface has been
  found to date.
